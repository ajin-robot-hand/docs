site_name: Robot Hand Team Blog
site_description: 팀원들이 각자 진행한 작업을 기록하는 팀 블로그
# TODO: 아래 두 값을 실제 GitHub organization/repo 이름에 맞게 수정하세요.
site_url: https://ajin-robot-hand.github.io/docs/
repo_url: https://github.com/ajin-robot-hand/docs
repo_name: ajin-robot-hand/docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_url_date_format: yyyy/MM
      post_excerpt: required
      post_excerpt_separator: <!-- more -->
      pagination_per_page: 10
      categories: true
      categories_name: 작성자
      archive: true
      archive_name: 아카이브

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 홈: index.md
  - 블로그:
      - blog/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ajin-robot-hand
